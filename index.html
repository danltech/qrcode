<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR-Code Generator – einfach & professionell</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    min-height: 100vh;
    color: #111827;
    padding: 24px 16px 60px;
  }

  .app { max-width: 1200px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 28px; }

  header h1 {
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  header p { color: #6b7280; font-size: 0.95rem; }

  /* ---------- Typ-Kacheln ---------- */
  .type-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }

  .type-tile {
    background: #fff;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    padding: 14px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
    color: #374151;
  }

  .type-tile:hover {
    border-color: #a5b4fc;
    background: #f5f3ff;
    transform: translateY(-2px);
  }

  .type-tile.active {
    border-color: #6366f1;
    background: #eef2ff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
  }

  .type-icon { font-size: 26px; line-height: 1; }
  .type-label { font-size: 12px; font-weight: 600; }

  /* ---------- Layout ---------- */
  .main-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    .right-col { position: static !important; }
  }

  .right-col { position: sticky; top: 24px; align-self: start; }

  /* ---------- Karten ---------- */
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(17, 24, 39, 0.05);
    border: 1px solid #f3f4f6;
    margin-bottom: 20px;
  }

  .card h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: #111827;
  }

  /* ---------- Formularfelder ---------- */
  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-weight: 500;
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 6px;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fafafa;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    color: #111827;
  }

  .field textarea { resize: vertical; min-height: 70px; }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    outline: none;
    border-color: #6366f1;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
  }

  .data-preview {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f9fafb;
    border: 1px dashed #d1d5db;
    border-radius: 10px;
    font-size: 0.82rem;
    color: #4b5563;
    word-break: break-all;
    font-family: ui-monospace, 'Cascadia Code', monospace;
  }

  .data-preview.empty { color: #9ca3af; font-style: italic; }

  /* ---------- Presets ---------- */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .preset-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0, 0, 0, 0.15);
    padding: 0;
  }

  .preset-btn:hover {
    transform: scale(1.12);
    box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(0, 0, 0, 0.22);
  }

  /* ---------- Style-Grid ---------- */
  .style-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }

  .style-item label {
    display: block;
    font-weight: 500;
    font-size: 0.78rem;
    color: #6b7280;
    margin-bottom: 4px;
  }

  .style-item input[type="color"] {
    width: 100%;
    height: 38px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    cursor: pointer;
    background: #fff;
    padding: 3px;
  }

  .style-item select {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 0.88rem;
    background: #fafafa;
    font-family: inherit;
    cursor: pointer;
    color: #111827;
  }

  .style-item select:focus { outline: none; border-color: #6366f1; }

  /* ---------- Checkbox ---------- */
  .checkbox-label {
    display: flex !important;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-weight: 500 !important;
    font-size: 0.9rem !important;
    color: #374151 !important;
  }

  .checkbox-label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #6366f1;
    cursor: pointer;
  }

  /* ---------- Datei-Upload ---------- */
  .file-input-wrapper { position: relative; overflow: hidden; }

  .file-input-wrapper input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .file-input-label {
    padding: 12px;
    border: 2px dashed #d1d5db;
    border-radius: 10px;
    text-align: center;
    font-size: 0.88rem;
    color: #6b7280;
    cursor: pointer;
    transition: all 0.2s;
  }

  .file-input-wrapper:hover .file-input-label {
    border-color: #6366f1;
    background: #eef2ff;
    color: #4f46e5;
  }

  .logo-preview {
    max-height: 60px;
    max-width: 100%;
    margin-top: 8px;
    border-radius: 8px;
    display: none;
    border: 1px solid #e5e7eb;
  }

  /* ---------- Vorschau ---------- */
  .preview-card {
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(17, 24, 39, 0.05);
    border: 1px solid #f3f4f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #qrcode {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 280px;
    width: 100%;
  }

  #qrcode canvas,
  #qrcode img,
  #qrcode svg {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    display: block;
  }

  .download-btn {
    width: 100%;
    padding: 14px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    font-family: inherit;
  }

  .download-btn:hover:not(:disabled) { background: #4f46e5; }
  .download-btn:active:not(:disabled) { transform: scale(0.98); }
  .download-btn:disabled { background: #c7d2fe; cursor: not-allowed; }

  .hint {
    font-size: 0.78rem;
    color: #9ca3af;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🔳 QR-Code Generator</h1>
    <p>Wähle einen Typ, gib deine Daten ein und gestalte deinen QR-Code.</p>
  </header>

  <!-- Typ-Auswahl -->
  <div class="type-tiles" id="typeTiles"></div>

  <div class="main-grid">
    <div class="left-col">
      <!-- Inhalt -->
      <section class="card">
        <h2 id="formTitle">Website</h2>
        <div id="formFields"></div>
        <div class="data-preview empty" id="dataPreview">Noch keine Daten</div>
      </section>

      <!-- Design -->
      <section class="card">
        <h2>🎨 Design</h2>
        <div class="presets" id="presets"></div>

        <div class="style-grid">
          <div class="style-item">
            <label for="dotsColor">Punktfarbe</label>
            <input type="color" id="dotsColor" value="#111827">
          </div>
          <div class="style-item">
            <label for="cornerSquareColor">Ecken-Rahmen</label>
            <input type="color" id="cornerSquareColor" value="#111827">
          </div>
          <div class="style-item">
            <label for="cornerDotColor">Ecken-Punkt</label>
            <input type="color" id="cornerDotColor" value="#111827">
          </div>
          <div class="style-item">
            <label for="bgColor">Hintergrund</label>
            <input type="color" id="bgColor" value="#ffffff">
          </div>
        </div>

        <div class="style-grid">
          <div class="style-item">
            <label for="dotsType">Punktform</label>
            <select id="dotsType">
              <option value="square">Quadrat</option>
              <option value="dots">Punkte</option>
              <option value="rounded" selected>Abgerundet</option>
              <option value="classy">Classy</option>
              <option value="classy-rounded">Classy Rounded</option>
              <option value="extra-rounded">Extra Rounded</option>
            </select>
          </div>
          <div class="style-item">
            <label for="cornerSquareType">Ecken-Form</label>
            <select id="cornerSquareType">
              <option value="square">Quadrat</option>
              <option value="dot">Punkt</option>
              <option value="extra-rounded" selected>Extra Rounded</option>
            </select>
          </div>
          <div class="style-item">
            <label for="cornerDotType">Ecken-Punkt-Form</label>
            <select id="cornerDotType">
              <option value="square">Quadrat</option>
              <option value="dot" selected>Punkt</option>
            </select>
          </div>
        </div>

        <div class="style-item" style="margin-top:14px;">
          <label class="checkbox-label">
            <input type="checkbox" id="useLogo">
            Logo in der Mitte einbetten
          </label>
        </div>
        <div id="logoUploadGroup" style="display:none; margin-top:10px;">
          <div class="file-input-wrapper">
            <input type="file" id="logoFile" accept="image/*">
            <div class="file-input-label">📁 Logo auswählen</div>
          </div>
          <img id="logoPreview" class="logo-preview" alt="Logo-Vorschau">
        </div>
      </section>

      <!-- Erweitert -->
      <section class="card">
        <h2>⚙️ Erweitert</h2>
        <div class="style-grid">
          <div class="style-item">
            <label for="ecc">Fehlerkorrektur</label>
            <select id="ecc">
              <option value="L">L – 7 %</option>
              <option value="M" selected>M – 15 %</option>
              <option value="Q">Q – 25 %</option>
              <option value="H">H – 30 %</option>
            </select>
          </div>
          <div class="style-item">
            <label for="version">Version (0 = auto)</label>
            <select id="version">
              <option value="0" selected>Automatisch</option>
            </select>
          </div>
          <div class="style-item">
            <label for="mode">Modus</label>
            <select id="mode">
              <option value="Byte" selected>Byte (Standard)</option>
              <option value="Numeric">Numeric</option>
              <option value="Alphanumeric">Alphanumeric</option>
              <option value="Kanji">Kanji</option>
            </select>
          </div>
        </div>
        <p class="hint" style="text-align:left; margin-top:8px;">
          💡 <strong>Byte</strong> funktioniert für alle Daten. Bei aktivem Logo wird automatisch <strong>H</strong> genutzt.
        </p>
      </section>
    </div>

    <!-- Vorschau -->
    <div class="right-col">
      <div class="preview-card">
        <div id="qrcode"></div>
        <button class="download-btn" id="downloadBtn" disabled>⬇️ Als PNG herunterladen</button>
        <p class="hint">Die Vorschau wird automatisch aktualisiert.</p>
      </div>
    </div>
  </div>
</div>

<!-- Bibliothek -->
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.min.js"></script>

<script>
/* =========================================================
   CONTENT-TYPEN
   ========================================================= */
const contentTypes = {
  url: {
    label: 'Website', icon: '🌐',
    fields: [
      { name: 'url', label: 'URL', type: 'text', placeholder: 'z. B. wikipedia.org', value: 'https://www.wikipedia.org' }
    ],
    build(v) {
      let u = (v.url || '').trim();
      if (u && !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) u = 'https://' + u;
      return u;
    }
  },
  text: {
    label: 'Text', icon: '📝',
    fields: [
      { name: 'text', label: 'Dein Text', type: 'textarea', placeholder: 'Beliebiger Text …', value: '' }
    ],
    build(v) { return (v.text || '').trim(); }
  },
  phone: {
    label: 'Telefon', icon: '📞',
    fields: [
      { name: 'phone', label: 'Telefonnummer', type: 'tel', placeholder: '+49 123 456789', value: '' }
    ],
    build(v) {
      const p = (v.phone || '').replace(/[^\d+]/g, '');
      return p ? 'tel:' + p : '';
    }
  },
  email: {
    label: 'E-Mail', icon: '✉️',
    fields: [
      { name: 'to', label: 'Empfänger', type: 'email', placeholder: 'info@example.com', value: '' },
      { name: 'subject', label: 'Betreff (optional)', type: 'text', placeholder: '', value: '' },
      { name: 'body', label: 'Nachricht (optional)', type: 'textarea', placeholder: '', value: '' }
    ],
    build(v) {
      const to = (v.to || '').trim();
      if (!to) return '';
      let s = 'mailto:' + to;
      const p = [];
      if (v.subject) p.push('subject=' + encodeURIComponent(v.subject));
      if (v.body) p.push('body=' + encodeURIComponent(v.body));
      if (p.length) s += '?' + p.join('&');
      return s;
    }
  },
  sms: {
    label: 'SMS', icon: '💬',
    fields: [
      { name: 'phone', label: 'Telefonnummer', type: 'tel', placeholder: '+49 123 456789', value: '' },
      { name: 'message', label: 'Nachricht', type: 'textarea', placeholder: 'Hallo!', value: '' }
    ],
    build(v) {
      const p = (v.phone || '').replace(/\s+/g, '');
      if (!p) return '';
      return v.message ? `SMSTO:${p}:${v.message}` : `SMSTO:${p}`;
    }
  },
  wifi: {
    label: 'WLAN', icon: '📶',
    fields: [
      { name: 'ssid', label: 'Netzwerkname (SSID)', type: 'text', placeholder: 'MeinWLAN', value: '' },
      { name: 'password', label: 'Passwort', type: 'text', placeholder: '', value: '' },
      { name: 'encryption', label: 'Verschlüsselung', type: 'select',
        options: [['WPA', 'WPA/WPA2/WPA3'], ['WEP', 'WEP'], ['nopass', 'Offen (kein Passwort)']], value: 'WPA' },
      { name: 'hidden', label: 'Verstecktes Netzwerk', type: 'checkbox', value: false }
    ],
    build(v) {
      if (!v.ssid) return '';
      const esc = (s) => String(s || '').replace(/([\\;,":])/g, '\\$1');
      let s = `WIFI:T:${v.encryption};S:${esc(v.ssid)};`;
      if (v.encryption !== 'nopass') s += `P:${esc(v.password)};`;
      if (v.hidden) s += 'H:true;';
      return s + ';';
    }
  },
  vcard: {
    label: 'Kontakt', icon: '👤',
    fields: [
      { name: 'firstname', label: 'Vorname', type: 'text', placeholder: 'Max', value: '' },
      { name: 'lastname', label: 'Nachname', type: 'text', placeholder: 'Mustermann', value: '' },
      { name: 'org', label: 'Firma (optional)', type: 'text', placeholder: '', value: '' },
      { name: 'phone', label: 'Telefon', type: 'tel', placeholder: '', value: '' },
      { name: 'email', label: 'E-Mail', type: 'email', placeholder: '', value: '' },
      { name: 'url', label: 'Website', type: 'url', placeholder: '', value: '' },
      { name: 'street', label: 'Straße', type: 'text', placeholder: '', value: '' },
      { name: 'zip', label: 'PLZ', type: 'text', placeholder: '', value: '' },
      { name: 'city', label: 'Stadt', type: 'text', placeholder: '', value: '' }
    ],
    build(v) {
      const fn = (v.firstname || '').trim();
      const ln = (v.lastname || '').trim();
      if (!fn && !ln) return '';
      const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
      lines.push(`N:${ln};${fn};;;`);
      lines.push(`FN:${[fn, ln].filter(Boolean).join(' ')}`);
      if (v.org) lines.push(`ORG:${v.org}`);
      if (v.phone) lines.push(`TEL;TYPE=CELL:${v.phone}`);
      if (v.email) lines.push(`EMAIL:${v.email}`);
      if (v.url) lines.push(`URL:${v.url}`);
      if (v.street || v.zip || v.city)
        lines.push(`ADR:;;${v.street || ''};${v.city || ''};;${v.zip || ''};`);
      lines.push('END:VCARD');
      return lines.join('\r\n');
    }
  },
  geo: {
    label: 'Standort', icon: '📍',
    fields: [
      { name: 'lat', label: 'Breitengrad', type: 'text', placeholder: '52.5200', value: '' },
      { name: 'lng', label: 'Längengrad', type: 'text', placeholder: '13.4050', value: '' }
    ],
    build(v) {
      const lat = (v.lat || '').trim();
      const lng = (v.lng || '').trim();
      return (lat && lng) ? `geo:${lat},${lng}` : '';
    }
  },
  event: {
    label: 'Termin', icon: '📅',
    fields: [
      { name: 'title', label: 'Titel', type: 'text', placeholder: 'Meeting', value: '' },
      { name: 'location', label: 'Ort', type: 'text', placeholder: '', value: '' },
      { name: 'start', label: 'Beginn', type: 'datetime-local', value: '' },
      { name: 'end', label: 'Ende', type: 'datetime-local', value: '' }
    ],
    build(v) {
      if (!v.title) return '';
      const f = (s) => s ? s.replace(/[-:]/g, '') + '00' : '';
      const lines = ['BEGIN:VEVENT'];
      if (v.title) lines.push(`SUMMARY:${v.title}`);
      if (v.location) lines.push(`LOCATION:${v.location}`);
      if (v.start) lines.push(`DTSTART:${f(v.start)}`);
      if (v.end) lines.push(`DTEND:${f(v.end)}`);
      lines.push('END:VEVENT');
      return lines.join('\r\n');
    }
  }
};

/* =========================================================
   PRESETS
   ========================================================= */
const presets = [
  { id: 'classic', dots: '#111827', cornerSquare: '#111827', cornerDot: '#111827', bg: '#ffffff',
    dotsType: 'square', cornerSquareType: 'square', cornerDotType: 'square' },
  { id: 'modern',  dots: '#4f46e5', cornerSquare: '#4f46e5', cornerDot: '#4f46e5', bg: '#ffffff',
    dotsType: 'rounded', cornerSquareType: 'extra-rounded', cornerDotType: 'dot' },
  { id: 'sunset',  dots: '#f97316', cornerSquare: '#dc2626', cornerDot: '#dc2626', bg: '#fff7ed',
    dotsType: 'dots', cornerSquareType: 'extra-rounded', cornerDotType: 'dot' },
  { id: 'ocean',   dots: '#0891b2', cornerSquare: '#0e7490', cornerDot: '#0e7490', bg: '#ecfeff',
    dotsType: 'classy-rounded', cornerSquareType: 'extra-rounded', cornerDotType: 'dot' },
  { id: 'forest',  dots: '#16a34a', cornerSquare: '#15803d', cornerDot: '#15803d', bg: '#f0fdf4',
    dotsType: 'rounded', cornerSquareType: 'extra-rounded', cornerDotType: 'dot' },
  { id: 'pink',    dots: '#db2777', cornerSquare: '#be185d', cornerDot: '#be185d', bg: '#fdf2f8',
    dotsType: 'classy', cornerSquareType: 'extra-rounded', cornerDotType: 'dot' },
  { id: 'dark',    dots: '#ffffff', cornerSquare: '#ffffff', cornerDot: '#ffffff', bg: '#111827',
    dotsType: 'rounded', cornerSquareType: 'extra-rounded', cornerDotType: 'dot' }
];

/* =========================================================
   ZUSTAND
   ========================================================= */
let currentType = 'url';
let logoDataUrl = null;
let qrCodeInstance = null;
let debounceTimer = null;

/* =========================================================
   DOM-REFERENZEN
   ========================================================= */
const $ = (id) => document.getElementById(id);
const typeTiles    = $('typeTiles');
const formFields   = $('formFields');
const formTitle    = $('formTitle');
const dataPreview  = $('dataPreview');
const presetsEl    = $('presets');
const downloadBtn  = $('downloadBtn');
const qrcodeEl     = $('qrcode');
const useLogoCheck = $('useLogo');
const logoUploadGrp = $('logoUploadGroup');
const logoFileInput = $('logoFile');
const logoPreview  = $('logoPreview');

/* =========================================================
   RENDER: TYP-KACHELN
   ========================================================= */
function renderTypeTiles() {
  typeTiles.innerHTML = Object.entries(contentTypes).map(([key, t]) => `
    <button class="type-tile ${key === currentType ? 'active' : ''}" data-type="${key}" type="button">
      <span class="type-icon">${t.icon}</span>
      <span class="type-label">${t.label}</span>
    </button>`).join('');
}

/* =========================================================
   RENDER: FORMULAR
   ========================================================= */
function renderForm() {
  const t = contentTypes[currentType];
  formTitle.textContent = t.label;

  let html = '';
  t.fields.forEach(f => {
    const id = 'f_' + f.name;
    const safeVal = (f.value ?? '').toString().replace(/"/g, '&quot;');
    let control = '';

    if (f.type === 'textarea') {
      control = `<textarea id="${id}" data-field="${f.name}" placeholder="${f.placeholder || ''}">${f.value || ''}</textarea>`;
    } else if (f.type === 'select') {
      control = `<select id="${id}" data-field="${f.name}">${f.options.map(([v, l]) =>
        `<option value="${v}" ${v === f.value ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    } else if (f.type === 'checkbox') {
      html += `<div class="field"><label class="checkbox-label">
        <input type="checkbox" id="${id}" data-field="${f.name}" ${f.value ? 'checked' : ''}>
        ${f.label}</label></div>`;
      return;
    } else {
      control = `<input type="${f.type || 'text'}" id="${id}" data-field="${f.name}"
        placeholder="${f.placeholder || ''}" value="${safeVal}">`;
    }

    html += `<div class="field">
      <label for="${id}">${f.label}</label>
      ${control}
    </div>`;
  });

  formFields.innerHTML = html;
}

/* =========================================================
   WERTE LESEN & DATEN BAUEN
   ========================================================= */
function getFormValues() {
  const t = contentTypes[currentType];
  const v = {};
  t.fields.forEach(f => {
    const el = formFields.querySelector(`[data-field="${f.name}"]`);
    if (!el) return;
    v[f.name] = f.type === 'checkbox' ? el.checked : el.value;
  });
  return v;
}

function buildData() {
  try {
    return contentTypes[currentType].build(getFormValues()) || '';
  } catch (e) {
    console.error(e);
    return '';
  }
}

/* =========================================================
   STYLE AUS FORMULAR LESEN
   ========================================================= */
function getStyle() {
  return {
    dotsColor: $('dotsColor').value,
    cornerSquareColor: $('cornerSquareColor').value,
    cornerDotColor: $('cornerDotColor').value,
    bgColor: $('bgColor').value,
    dotsType: $('dotsType').value,
    cornerSquareType: $('cornerSquareType').value,
    cornerDotType: $('cornerDotType').value
  };
}

/* =========================================================
   QR-CODE AKTUALISIEREN
   ========================================================= */
function updateQr() {
  const data = buildData();
  const style = getStyle();
  const useLogo = useLogoCheck.checked && !!logoDataUrl;
  const ecc = useLogo ? 'H' : $('ecc').value;

  // Datenvorschau
  if (data) {
    const shown = data.length > 120 ? data.slice(0, 120) + '…' : data;
    dataPreview.textContent = shown.replace(/\r?\n/g, ' ↵ ');
    dataPreview.classList.remove('empty');
  } else {
    dataPreview.textContent = '⚠️ Bitte fülle die Felder aus.';
    dataPreview.classList.add('empty');
  }

  // Instanz erstellen
  if (!qrCodeInstance) {
    qrCodeInstance = new QRCodeStyling({ width: 280, height: 280, margin: 12, type: 'canvas' });
    qrcodeEl.innerHTML = '';
    qrCodeInstance.append(qrcodeEl);
  }

  try {
    qrCodeInstance.update({
      data: data || ' ',
      image: useLogo ? logoDataUrl : '',
      qrOptions: {
        typeNumber: parseInt($('version').value, 10) || 0,
        mode: $('mode').value,
        errorCorrectionLevel: ecc
      },
      dotsOptions: {
        color: style.dotsColor,
        type: style.dotsType
      },
      cornersSquareOptions: {
        color: style.cornerSquareColor,
        type: style.cornerSquareType
      },
      cornersDotOptions: {
        color: style.cornerDotColor,
        type: style.cornerDotType
      },
      backgroundOptions: { color: style.bgColor },
      imageOptions: {
        hideBackgroundDots: true,
        imageSize: 0.4,
        margin: 6,
        crossOrigin: 'anonymous'
      }
    });
  } catch (e) {
    console.error('QR-Fehler:', e);
  }

  downloadBtn.disabled = !data;
}

function scheduleUpdate() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updateQr, 150);
}

/* =========================================================
   PRESETS RENDERN + ANWENDEN
   ========================================================= */
function renderPresets() {
  presetsEl.innerHTML = presets.map(p =>
    `<button class="preset-btn" data-preset="${p.id}" title="${p.id}"
      style="background:${p.dots}; border:3px solid ${p.cornerSquare};"></button>`
  ).join('');
}

function applyPreset(id) {
  const p = presets.find(x => x.id === id);
  if (!p) return;
  $('dotsColor').value = p.dots;
  $('cornerSquareColor').value = p.cornerSquare;
  $('cornerDotColor').value = p.cornerDot;
  $('bgColor').value = p.bg;
  $('dotsType').value = p.dotsType;
  $('cornerSquareType').value = p.cornerSquareType;
  $('cornerDotType').value = p.cornerDotType;
  updateQr();
}

/* =========================================================
   EVENTS
   ========================================================= */
typeTiles.addEventListener('click', (e) => {
  const tile = e.target.closest('.type-tile');
  if (!tile) return;
  currentType = tile.dataset.type;
  document.querySelectorAll('.type-tile').forEach(t =>
    t.classList.toggle('active', t.dataset.type === currentType));
  renderForm();
  updateQr();
});

presetsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.preset-btn');
  if (btn) applyPreset(btn.dataset.preset);
});

// Formular-Eingaben
['input', 'change'].forEach(evt => {
  formFields.addEventListener(evt, scheduleUpdate);
});

// Style-Änderungen
['dotsColor','cornerSquareColor','cornerDotColor','bgColor',
 'dotsType','cornerSquareType','cornerDotType',
 'ecc','version','mode'].forEach(id => {
  const el = $(id);
  el.addEventListener('input', scheduleUpdate);
  el.addEventListener('change', scheduleUpdate);
});

// Logo
useLogoCheck.addEventListener('change', () => {
  logoUploadGrp.style.display = useLogoCheck.checked ? 'block' : 'none';
  scheduleUpdate();
});

logoFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    logoDataUrl = ev.target.result;
    logoPreview.src = logoDataUrl;
    logoPreview.style.display = 'block';
    updateQr();
  };
  reader.readAsDataURL(file);
});

// Download
downloadBtn.addEventListener('click', () => {
  if (qrCodeInstance) {
    qrCodeInstance.download({ name: 'qrcode', extension: 'png' });
  }
});

/* =========================================================
   VERSION-SELECT BEFÜLLEN (1–40)
   ========================================================= */
(function fillVersions() {
  const sel = $('version');
  for (let i = 1; i <= 40; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    sel.appendChild(opt);
  }
})();

/* =========================================================
   INIT
   ========================================================= */
renderTypeTiles();
renderForm();
renderPresets();
updateQr();
</script>
</body>
</html>
